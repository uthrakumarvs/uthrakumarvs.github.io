<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Speed Test | Uthra Kumar</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f; --card: #1a1a2e; --text: #e8e8f0; --muted: #a0a0b8;
      --accent: #6c63ff; --accent-glow: rgba(108,99,255,0.3);
      --gradient: linear-gradient(135deg, #6c63ff, #e040fb, #00bcd4);
      --green: #4ade80; --red: #f87171;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'SF Mono', 'Fira Code', monospace;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
    a { color: var(--accent); text-decoration: none; }
    .back { position: fixed; top: 1.5rem; left: 1.5rem; font-family: var(--mono); font-size: 0.9rem; color: var(--muted); transition: color 0.3s; z-index: 10; }
    .back:hover { color: var(--text); }

    h1 { font-size: 2rem; margin-top: 2rem; margin-bottom: 0.3rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }

    .stats { display: flex; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: center; }
    .stat-box { background: var(--card); border: 1px solid rgba(108,99,255,0.1); border-radius: 12px; padding: 1rem 1.5rem; text-align: center; min-width: 100px; }
    .stat-val { font-size: 2rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.2rem; }

    .text-display {
      background: var(--card); border: 1px solid rgba(108,99,255,0.1); border-radius: 16px;
      padding: 2rem; max-width: 700px; width: 100%; font-family: var(--mono); font-size: 1.15rem;
      line-height: 2; letter-spacing: 0.02em; position: relative; min-height: 150px;
      user-select: none;
    }
    .char { color: var(--muted); transition: color 0.1s; }
    .char.correct { color: var(--green); }
    .char.incorrect { color: var(--red); text-decoration: underline; }
    .char.current { border-left: 2px solid var(--accent); animation: blink 1s step-end infinite; margin-left: -1px; }
    @keyframes blink { 50% { border-color: transparent; } }

    .hidden-input { position: absolute; opacity: 0; width: 0; height: 0; }

    .timer-bar { width: 100%; max-width: 700px; height: 4px; background: var(--card); border-radius: 2px; margin-top: 1.5rem; overflow: hidden; }
    .timer-fill { height: 100%; background: var(--gradient); border-radius: 2px; transition: width 0.1s linear; width: 100%; }

    .controls { margin-top: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; align-items: center; }
    .btn {
      padding: 0.7rem 1.6rem; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.3s ease;
      background: var(--gradient); color: #fff; box-shadow: 0 4px 15px var(--accent-glow);
      font-family: var(--font);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px var(--accent-glow); }

    .toggle-group { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(108,99,255,0.3); }
    .toggle-btn {
      padding: 0.5rem 0.9rem; font-size: 0.78rem; font-weight: 600; border: none;
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.3s;
      font-family: var(--font);
    }
    .toggle-btn.active { background: rgba(108,99,255,0.2); color: var(--text); }

    .results { text-align: center; margin-top: 2rem; display: none; }
    .results h2 { font-size: 1.5rem; margin-bottom: 1rem; }
    .result-grid { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }

    .click-hint { color: var(--muted); font-size: 0.85rem; margin-top: 1rem; font-family: var(--mono); }

    @media (max-width: 600px) {
      .text-display { font-size: 1rem; padding: 1.5rem; }
      .stats { gap: 1rem; }
      .stat-box { min-width: 80px; padding: 0.8rem 1rem; }
      .stat-val { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <a href="/" class="back">&larr; Back</a>
  <h1>Typing Speed Test</h1>
  <p class="subtitle">Test how fast and accurately you can type</p>

  <div class="stats">
    <div class="stat-box"><div class="stat-val" id="wpmStat">0</div><div class="stat-label">WPM</div></div>
    <div class="stat-box"><div class="stat-val" id="accStat">100</div><div class="stat-label">Accuracy %</div></div>
    <div class="stat-box"><div class="stat-val" id="timeStat">30</div><div class="stat-label">Seconds</div></div>
  </div>

  <div class="text-display" id="textDisplay" tabindex="0"></div>
  <input class="hidden-input" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
  <p class="click-hint" id="hint">Click the text area and start typing</p>

  <div class="controls">
    <button class="btn" id="resetBtn">Restart</button>
    <div class="toggle-group">
      <button class="toggle-btn" data-time="15">15s</button>
      <button class="toggle-btn active" data-time="30">30s</button>
      <button class="toggle-btn" data-time="60">60s</button>
    </div>
  </div>

  <div class="results" id="results">
    <h2>Results</h2>
    <div class="result-grid" id="resultGrid"></div>
  </div>

  <script>
    const sentences = [
      "The quick brown fox jumps over the lazy dog near the riverbank",
      "A journey of a thousand miles begins with a single step forward",
      "She sells seashells by the seashore during warm summer afternoons",
      "Practice makes perfect when you stay consistent and work hard daily",
      "The best way to predict the future is to create it with effort",
      "Every great developer you know started by solving simple problems first",
      "Code is like humor when you have to explain it the quality drops",
      "Simplicity is the soul of efficiency in both design and engineering",
      "First solve the problem then write the clean and elegant code",
      "The only way to learn programming is by writing actual code daily",
      "Good software is written by developers who care deeply about craft",
      "Talk is cheap but show me the code that actually works well",
      "Innovation distinguishes between a leader and a follower in any field",
      "Stay hungry stay foolish and always keep learning something brand new",
      "Any sufficiently advanced technology is indistinguishable from pure magic",
    ];

    let text, charIndex, started, timer, timeLeft, duration, correctChars, totalTyped, errors;

    function getRandomText() {
      const shuffled = [...sentences].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 3).join(' ');
    }

    function init() {
      duration = duration || 30;
      timeLeft = duration;
      text = getRandomText();
      charIndex = 0;
      started = false;
      correctChars = 0;
      totalTyped = 0;
      errors = 0;
      clearInterval(timer);

      document.getElementById('wpmStat').textContent = '0';
      document.getElementById('accStat').textContent = '100';
      document.getElementById('timeStat').textContent = duration;
      document.getElementById('timerFill').style.width = '100%';
      document.getElementById('results').style.display = 'none';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('hiddenInput').value = '';
      document.getElementById('hiddenInput').disabled = false;

      renderText();
    }

    function renderText() {
      const display = document.getElementById('textDisplay');
      display.innerHTML = '';
      text.split('').forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'char' + (i === charIndex ? ' current' : '');
        span.textContent = ch;
        display.appendChild(span);
      });
    }

    function startTimer() {
      started = true;
      document.getElementById('hint').style.display = 'none';
      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timeStat').textContent = timeLeft;
        document.getElementById('timerFill').style.width = (timeLeft / duration * 100) + '%';

        const elapsed = duration - timeLeft;
        if (elapsed > 0) {
          const wpm = Math.round((correctChars / 5) / (elapsed / 60));
          document.getElementById('wpmStat').textContent = wpm;
        }

        if (timeLeft <= 0) {
          endTest();
        }
      }, 1000);
    }

    function endTest() {
      clearInterval(timer);
      document.getElementById('hiddenInput').disabled = true;
      const elapsed = duration;
      const wpm = Math.round((correctChars / 5) / (elapsed / 60));
      const acc = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;

      document.getElementById('wpmStat').textContent = wpm;
      document.getElementById('accStat').textContent = acc;

      const results = document.getElementById('results');
      const grid = document.getElementById('resultGrid');
      grid.innerHTML = '';
      const data = [
        { label: 'WPM', value: wpm },
        { label: 'Accuracy', value: acc + '%' },
        { label: 'Characters', value: correctChars },
        { label: 'Errors', value: errors },
      ];
      data.forEach(d => {
        const box = document.createElement('div');
        box.className = 'stat-box';
        box.innerHTML = '<div class="stat-val">' + d.value + '</div><div class="stat-label">' + d.label + '</div>';
        grid.appendChild(box);
      });
      results.style.display = 'block';
    }

    function handleInput(e) {
      if (charIndex >= text.length) return;
      if (!started) startTimer();

      const typed = e.data;
      if (typed === null) return; // ignore backspace, etc.

      totalTyped++;
      const expected = text[charIndex];

      const chars = document.querySelectorAll('.char');
      if (typed === expected) {
        chars[charIndex].classList.remove('current');
        chars[charIndex].classList.add('correct');
        correctChars++;
      } else {
        chars[charIndex].classList.remove('current');
        chars[charIndex].classList.add('incorrect');
        errors++;
      }

      charIndex++;
      if (charIndex < text.length) {
        chars[charIndex].classList.add('current');
      }

      // Update accuracy live
      const acc = totalTyped > 0 ? Math.round((correctChars / totalTyped) * 100) : 100;
      document.getElementById('accStat').textContent = acc;

      if (charIndex >= text.length) {
        endTest();
      }
    }

    // Focus management
    const display = document.getElementById('textDisplay');
    const input = document.getElementById('hiddenInput');

    display.addEventListener('click', () => input.focus());
    input.addEventListener('input', handleInput);

    document.getElementById('resetBtn').addEventListener('click', () => { init(); input.focus(); });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        duration = parseInt(btn.dataset.time);
        init();
      });
    });

    init();
  </script>
</body>
</html>
